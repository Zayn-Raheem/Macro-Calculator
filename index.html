<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barebones Macro Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5-QRCode Library for Camera Barcode Scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Style for scanner video container */
        #interactive video {
            width: 100% !important;
            height: auto !important;
            border-radius: 0.75rem;
            object-fit: cover;
        }
        #reader {
            border: none !important;
        }
        #reader__scan_region {
            background: #1e293b;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        #reader button {
            background-color: #3b82f6 !important;
            color: white !important;
            border-radius: 0.5rem !important;
            padding: 0.5rem 1rem !important;
            font-weight: 600 !important;
            border: none !important;
            margin: 0.5rem !important;
        }
    </style>
</head>
<body class="min-h-screen pb-12 antialiased selection:bg-blue-500 selection:text-white">

    <!-- Top Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold text-xl text-blue-500 fa-fire-flame-curved"></i>
                <h1 class="text-xl font-bold tracking-tight text-white">MacroTracker</h1>
            </div>
            <button onclick="fillMockSnickers()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                <i class="fa-solid fa-cookie-bite text-amber-500"></i> Test Snickers
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 space-y-6">

        <!-- TODAY'S TOTALS DISPLAY -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Today's Totals</h2>
                <span id="currentDateDisplay" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md"></span>
            </div>

            <!-- Big Calories Banner -->
            <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 text-center mb-4">
                <div class="text-xs font-medium text-slate-400 uppercase tracking-wide">Calories</div>
                <div class="text-4xl font-extrabold text-white mt-1" id="totalKcal">0</div>
                <div class="text-xs text-slate-500 mt-0.5">kcal</div>
            </div>

            <!-- 3 Macro Cards Grid -->
            <div class="grid grid-cols-3 gap-2 text-center">
                <!-- Protein -->
                <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-3">
                    <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Protein</div>
                    <div class="text-xl font-bold text-white mt-1" id="totalProtein">0<span class="text-xs text-slate-400 font-normal">g</span></div>
                </div>
                <!-- Carbs -->
                <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-3">
                    <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">Carbs</div>
                    <div class="text-xl font-bold text-white mt-1" id="totalCarbs">0<span class="text-xs text-slate-400 font-normal">g</span></div>
                </div>
                <!-- Fat -->
                <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-3">
                    <div class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">Fat</div>
                    <div class="text-xl font-bold text-white mt-1" id="totalFat">0<span class="text-xs text-slate-400 font-normal">g</span></div>
                </div>
            </div>
        </section>

        <!-- SCAN / LOOKUP SECTION -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-barcode text-blue-400"></i> Add Food Item
            </h2>

            <!-- Barcode Controls -->
            <div class="space-y-3">
                <div class="flex gap-2">
                    <input type="text" inputmode="numeric" id="barcodeInput" placeholder="Enter barcode number..." 
                           class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <button onclick="lookupBarcode()" id="searchBtn" 
                            class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition-colors flex items-center gap-1.5 shadow-md">
                        <i class="fa-solid fa-magnifying-glass"></i> Find
                    </button>
                </div>

                <button onclick="toggleCameraScanner()" id="toggleScanBtn" 
                        class="w-full bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-700/80 py-2.5 px-4 rounded-xl text-sm font-semibold transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-camera"></i> <span id="scanBtnText">Scan Barcode with Camera</span>
                </button>
            </div>

            <!-- Live Camera Modal Container -->
            <div id="scannerContainer" class="hidden relative overflow-hidden rounded-xl border border-blue-500/30 bg-slate-950 p-2">
                <div id="reader" class="w-full"></div>
                <p class="text-xs text-center text-slate-400 py-2">Point your camera at a barcode</p>
            </div>

            <!-- Status Indicator -->
            <div id="statusMessage" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

            <!-- PREPARATION FORM (Populated when product fetched or edited) -->
            <div id="calcForm" class="hidden border-t border-slate-800 pt-4 space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Product Found</span>
                        <input type="text" id="foodName" placeholder="Food Name (e.g. Snickers Bar)" 
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm font-semibold text-white mt-1 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <button onclick="resetForm()" class="text-slate-500 hover:text-slate-300 text-xs py-1">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Per 100g Inputs -->
                <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                    <div class="text-xs font-medium text-slate-400 mb-2">Nutritional values per <span class="text-white font-bold">100g</span>:</div>
                    <div class="grid grid-cols-4 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Kcal</label>
                            <input type="number" id="per100Kcal" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center font-medium focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Prot (g)</label>
                            <input type="number" id="per100Prot" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center font-medium focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Carb (g)</label>
                            <input type="number" id="per100Carb" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center font-medium focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Fat (g)</label>
                            <input type="number" id="per100Fat" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center font-medium focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Grams Eaten Input -->
                <div class="space-y-1.5">
                    <label for="gramsEaten" class="block text-xs font-medium text-slate-300">How many grams did you eat?</label>
                    <div class="relative">
                        <input type="number" id="gramsEaten" value="100" placeholder="e.g. 50" oninput="liveUpdateCalculatedValues()"
                               class="w-full bg-slate-800 border border-blue-500/50 rounded-xl px-3.5 py-2.5 text-lg font-bold text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <span class="absolute right-3.5 top-3 text-xs text-slate-400 font-medium">grams</span>
                    </div>
                </div>

                <!-- Live Preview calculated result -->
                <div id="livePreview" class="bg-blue-950/30 border border-blue-800/40 rounded-xl p-3 flex justify-between items-center text-xs">
                    <span class="text-slate-400">Calculated entry:</span>
                    <span id="previewSummary" class="font-bold text-blue-300">0 kcal | 0g P | 0g C | 0g F</span>
                </div>

                <!-- Submit Log Entry Button -->
                <button onclick="submitMealEntry()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add to Today's Log
                </button>
            </div>
        </section>

        <!-- TODAY'S LOG LIST -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-slate-400"></i> Today's Food Log
                </h2>
                <span id="logCountBadge" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-medium">0 items</span>
            </div>

            <!-- List Container -->
            <div id="logList" class="space-y-2">
                <!-- Dynamically filled -->
            </div>
        </section>

    </main>

    <script>
        // Global variables & state
        const STORAGE_KEY = 'macro_tracker_entries_v1';
        let html5QrCode = null;
        let isScanning = false;

        // Step 3 Core Math & Entry Creation Function
        function createEntryObject(name, per100g, grams) {
            const ratio = Math.max(0, grams) / 100;
            const now = new Date();
            
            // Format YYYY-MM-DD local time
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;

            return {
                id: 'entry_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                timestamp: now.getTime(),
                date: dateStr,
                name: name || 'Custom Item',
                grams: Math.round(grams * 10) / 10,
                kcal: Math.round((per100g.kcal || 0) * ratio),
                protein: Math.round((per100g.protein || 0) * ratio * 10) / 10,
                carbs: Math.round((per100g.carbs || 0) * ratio * 10) / 10,
                fat: Math.round((per100g.fat || 0) * ratio * 10) / 10
            };
        }

        // Local Storage Utilities
        function getSavedEntries() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error("Error loading localStorage data", e);
                return [];
            }
        }

        function saveEntries(entries) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
            } catch (e) {
                console.error("Error saving to localStorage", e);
            }
        }

        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function renderApp() {
            const todayStr = getTodayDateString();
            document.getElementById('currentDateDisplay').textContent = todayStr;

            const allEntries = getSavedEntries();
            const todayEntries = allEntries.filter(entry => entry.date === todayStr);

            // Calculate totals
            const totals = todayEntries.reduce((acc, curr) => {
                acc.kcal += curr.kcal || 0;
                acc.protein += curr.protein || 0;
                acc.carbs += curr.carbs || 0;
                acc.fat += curr.fat || 0;
                return acc;
            }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });

            // Render totals with smooth formatting
            document.getElementById('totalKcal').textContent = totals.kcal.toLocaleString();
            document.getElementById('totalProtein').textContent = totals.protein.toFixed(1);
            document.getElementById('totalCarbs').textContent = totals.carbs.toFixed(1);
            document.getElementById('totalFat').textContent = totals.fat.toFixed(1);

            // Render Today's Log
            const logContainer = document.getElementById('logList');
            document.getElementById('logCountBadge').textContent = `${todayEntries.length} ${todayEntries.length === 1 ? 'item' : 'items'}`;

            if (todayEntries.length === 0) {
                logContainer.innerHTML = `
                    <div class="text-center py-6 text-slate-500 text-xs border border-dashed border-slate-800 rounded-xl">
                        No food logged today yet.<br>Scan or enter a barcode above to start!
                    </div>
                `;
                return;
            }

            // Sort most recent first
            todayEntries.sort((a, b) => b.timestamp - a.timestamp);

            logContainer.innerHTML = todayEntries.map(entry => `
                <div class="bg-slate-800/60 border border-slate-800/80 rounded-xl p-3 flex justify-between items-center transition-all hover:border-slate-700">
                    <div class="space-y-0.5">
                        <div class="text-sm font-semibold text-white flex items-center gap-2">
                            ${escapeHtml(entry.name)}
                            <span class="text-[10px] font-normal text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">${entry.grams}g</span>
                        </div>
                        <div class="text-xs text-slate-400 flex gap-2">
                            <span class="text-emerald-400">${entry.protein}g P</span>
                            <span class="text-slate-600">•</span>
                            <span class="text-amber-400">${entry.carbs}g C</span>
                            <span class="text-slate-600">•</span>
                            <span class="text-rose-400">${entry.fat}g F</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <span class="text-sm font-bold text-white block">${entry.kcal}</span>
                            <span class="text-[9px] text-slate-500 uppercase">kcal</span>
                        </div>
                        <button onclick="deleteEntry('${entry.id}')" title="Delete Entry" 
                                class="text-slate-500 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition-colors">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function deleteEntry(id) {
            let entries = getSavedEntries();
            entries = entries.filter(e => e.id !== id);
            saveEntries(entries);
            renderApp();
        }

        async function lookupBarcode() {
            const barcodeInput = document.getElementById('barcodeInput');
            const code = barcodeInput.value.trim();

            if (!code) {
                showStatus('Please enter a valid barcode number.', 'error');
                return;
            }

            showStatus('Looking up Open Food Facts...', 'info');
            const searchBtn = document.getElementById('searchBtn');
            searchBtn.disabled = true;
            searchBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
                const data = await response.json();

                if (data.status === 1 && data.product) {
                    const prod = data.product;
                    const nutriments = prod.nutriments || {};

                    const name = prod.product_name || prod.product_name_en || 'Scanned Food Item';
                    const kcal = nutriments['energy-kcal_100g'] ?? nutriments['energy-kcal_value'] ?? (nutriments['energy_100g'] ? nutriments['energy_100g'] / 4.184 : 0);
                    const protein = nutriments['proteins_100g'] ?? 0;
                    const carbs = nutriments['carbohydrates_100g'] ?? 0;
                    const fat = nutriments['fat_100g'] ?? 0;

                    populateCalcForm(name, kcal, protein, carbs, fat);
                    showStatus(`Found: ${name}`, 'success');
                } else {
                    showStatus('Product not found in database. Please enter macros manually below.', 'warning');
                    populateCalcForm('Unknown Item', 0, 0, 0, 0);
                }
            } catch (err) {
                console.error(err);
                showStatus('Network error connecting to Open Food Facts. You can manually enter values.', 'warning');
                populateCalcForm('Manual Entry', 0, 0, 0, 0);
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> Find`;
            }
        }

        function toggleCameraScanner() {
            const container = document.getElementById('scannerContainer');
            const scanBtnText = document.getElementById('scanBtnText');

            if (isScanning) {
                stopScanner();
            } else {
                container.classList.remove('hidden');
                scanBtnText.textContent = "Close Camera";
                isScanning = true;

                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };

                html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText) => {
                        // On successful scan
                        document.getElementById('barcodeInput').value = decodedText;
                        stopScanner();
                        lookupBarcode();
                    },
                    (errorMessage) => {
                        // Code scanning error (normal while hunting for barcode)
                    }
                ).catch((err) => {
                    console.error("Camera access error:", err);
                    showStatus("Unable to access camera. Please check permissions or enter barcode manually.", "error");
                    stopScanner();
                });
            }
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    document.getElementById('scannerContainer').classList.add('hidden');
                    document.getElementById('scanBtnText').textContent = "Scan Barcode with Camera";
                    isScanning = false;
                }).catch(err => {
                    console.error("Error stopping camera:", err);
                    document.getElementById('scannerContainer').classList.add('hidden');
                    document.getElementById('scanBtnText').textContent = "Scan Barcode with Camera";
                    isScanning = false;
                });
            } else {
                document.getElementById('scannerContainer').classList.add('hidden');
                document.getElementById('scanBtnText').textContent = "Scan Barcode with Camera";
                isScanning = false;
            }
        }

        function populateCalcForm(name, kcal, protein, carbs, fat) {
            document.getElementById('foodName').value = name;
            document.getElementById('per100Kcal').value = Math.round(kcal * 10) / 10;
            document.getElementById('per100Prot').value = Math.round(protein * 10) / 10;
            document.getElementById('per100Carb').value = Math.round(carbs * 10) / 10;
            document.getElementById('per100Fat').value = Math.round(fat * 10) / 10;

            document.getElementById('calcForm').classList.remove('hidden');
            liveUpdateCalculatedValues();
        }

        function liveUpdateCalculatedValues() {
            const name = document.getElementById('foodName').value;
            const per100g = {
                kcal: parseFloat(document.getElementById('per100Kcal').value) || 0,
                protein: parseFloat(document.getElementById('per100Prot').value) || 0,
                carbs: parseFloat(document.getElementById('per100Carb').value) || 0,
                fat: parseFloat(document.getElementById('per100Fat').value) || 0
            };
            const grams = parseFloat(document.getElementById('gramsEaten').value) || 0;

            const preview = createEntryObject(name, per100g, grams);
            document.getElementById('previewSummary').textContent = 
                `${preview.kcal} kcal | ${preview.protein}g P | ${preview.carbs}g C | ${preview.fat}g F`;
        }

        function submitMealEntry() {
            const name = document.getElementById('foodName').value.trim() || 'Custom Item';
            const per100g = {
                kcal: parseFloat(document.getElementById('per100Kcal').value) || 0,
                protein: parseFloat(document.getElementById('per100Prot').value) || 0,
                carbs: parseFloat(document.getElementById('per100Carb').value) || 0,
                fat: parseFloat(document.getElementById('per100Fat').value) || 0
            };
            const grams = parseFloat(document.getElementById('gramsEaten').value) || 0;

            if (grams <= 0) {
                showStatus('Please enter a valid weight in grams eaten.', 'warning');
                return;
            }

            const newEntry = createEntryObject(name, per100g, grams);
            const entries = getSavedEntries();
            entries.push(newEntry);
            saveEntries(entries);

            resetForm();
            renderApp();
            showStatus(`Added "${newEntry.name}" (${newEntry.kcal} kcal) to today's log!`, 'success');
        }

        function resetForm() {
            document.getElementById('calcForm').classList.add('hidden');
            document.getElementById('barcodeInput').value = '';
            hideStatus();
        }

        function fillMockSnickers() {
            // Mock Snickers values per 100g
            // 488 kcal, 8.7g protein, 60g carbs, 24g fat
            document.getElementById('barcodeInput').value = '5000159461122';
            populateCalcForm('Snickers Bar (Mock)', 488, 8.7, 60, 24);
            document.getElementById('gramsEaten').value = 48; // standard single bar approx weight
            liveUpdateCalculatedValues();
            showStatus('Loaded Snickers test values! Adjust grams or tap "Add to Today\'s Log".', 'info');
        }

        function showStatus(msg, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.classList.remove('hidden', 'bg-red-950/50', 'border-red-800', 'text-red-300', 
                                'bg-emerald-950/50', 'border-emerald-800', 'text-emerald-300',
                                'bg-amber-950/50', 'border-amber-800', 'text-amber-300',
                                'bg-slate-800', 'border-slate-700', 'text-slate-300');

            if (type === 'error') {
                el.classList.add('bg-red-950/50', 'border-red-800', 'text-red-300');
            } else if (type === 'success') {
                el.classList.add('bg-emerald-950/50', 'border-emerald-800', 'text-emerald-300');
            } else if (type === 'warning') {
                el.classList.add('bg-amber-950/50', 'border-amber-800', 'text-amber-300');
            } else {
                el.classList.add('bg-slate-800', 'border-slate-700', 'text-slate-300');
            }

            el.textContent = msg;
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.add('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Attach listeners for dynamic input recalculation
        document.addEventListener('DOMContentLoaded', () => {
            ['foodName', 'per100Kcal', 'per100Prot', 'per100Carb', 'per100Fat'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', liveUpdateCalculatedValues);
            });

            // Initial view load
            renderApp();
        });
    </script>
</body>
</html>
